name: CatTV
options:
  deploymentTarget:
    iOS: '16.0'
packages:
  CatTVCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  CatTV:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CatTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cattv.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CatTV
        CatTVSourceURL: https://github.com/cx342662/CatTV/tree/ios/native-port
        NSLocalNetworkUsageDescription: 用户主动启用局域网媒体代理时，供同一网络的 AirPlay 设备访问当前媒体
        NSCameraUsageDescription: 扫描用户提供的影视源配置二维码
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CatTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: build/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CatTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cattv.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CatTV:
    build:
      targets:
        CatTV: all
    test:
      targets: [CatTVUITests]
