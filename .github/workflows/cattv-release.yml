name: Publish CatTV Signed Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Release version (for example 1.3.1)'
        required: true
        type: string
      versionCode:
        description: 'Android versionCode (must increase, for example 35)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested CatTV branch
        uses: actions/checkout@v4
        with:
          ref: cattv-branding
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Prepare branding
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py
      - name: Validate requested version and private signing secrets
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
          CATTV_KEYSTORE_BASE64: ${{ secrets.CATTV_KEYSTORE_BASE64 }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid versionCode"; exit 1; }
          [ "$VERSION_CODE" -gt 34 ] || { echo "::error::versionCode must exceed 34"; exit 1; }
          test -n "$CATTV_KEYSTORE_BASE64"
          test -n "$CATTV_KEY_ALIAS"
          test -n "$CATTV_STORE_PASSWORD"
          test -n "$CATTV_KEY_PASSWORD"
          printf '%s' "$CATTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cattv-release.jks"
          chmod 600 "$RUNNER_TEMP/cattv-release.jks"
      - name: Build signed release
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            "-PCATTV_VERSION_NAME=$VERSION_NAME" \
            "-PCATTV_VERSION_CODE=$VERSION_CODE" \
            "-PRELEASE_STORE_FILE=$RUNNER_TEMP/cattv-release.jks" \
            "-PRELEASE_KEY_ALIAS=$CATTV_KEY_ALIAS" \
            "-PRELEASE_STORE_PASSWORD=$CATTV_STORE_PASSWORD" \
            "-PRELEASE_KEY_PASSWORD=$CATTV_KEY_PASSWORD"
      - name: Verify signed APK and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/AVBox_release.apk"
          test -s "$SRC"
          OUT="CatTV_${VERSION_NAME}_arm64-v8a.apk"
          cp "$SRC" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$OUT" | head -n 4
          echo "$(sha256sum "$OUT")" > "$OUT.sha256"
          gh release create "v$VERSION_NAME" "$OUT" "$OUT.sha256" \
            --title "CatTV v$VERSION_NAME" \
            --notes "CatTV Android arm64-v8a signed release. Download the APK to install or update." \
            --latest
