name: Publish CatTV Signed Release

on:
  push:
    branches: [release/mobile-v1.3.4]
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Release version (for example 1.3.4)'
        required: true
        type: string
      versionCode:
        description: 'Android versionCode (must increase, for example 40)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested CatTV branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare branding
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py
      - name: Validate requested version and private signing secrets
        env:
          VERSION_NAME: ${{ inputs.versionName || '1.3.4' }}
          VERSION_CODE: ${{ inputs.versionCode || '40' }}
          CATTV_KEYSTORE_BASE64: ${{ secrets.CATTV_KEYSTORE_BASE64 }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid versionCode"; exit 1; }
          (( 10#$VERSION_CODE > 39 )) || { echo "::error::versionCode must exceed the previous mobile release"; exit 1; }
          test -n "$CATTV_KEYSTORE_BASE64"
          test -n "$CATTV_KEY_ALIAS"
          test -n "$CATTV_STORE_PASSWORD"
          test -n "$CATTV_KEY_PASSWORD"
          printf '%s' "$CATTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cattv-release.jks"
          chmod 600 "$RUNNER_TEMP/cattv-release.jks"
      - name: Build signed release
        env:
          VERSION_NAME: ${{ inputs.versionName || '1.3.4' }}
          VERSION_CODE: ${{ inputs.versionCode || '40' }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p dist
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          for PACKAGE in com.github.avbox.osc com.cattv.mobile; do
            SUFFIX=""
            if [ "$PACKAGE" = "com.cattv.mobile" ]; then SUFFIX="_coexist"; fi
            ./gradlew :app:assembleRelease --no-daemon \
              "-PCATTV_VERSION_NAME=$VERSION_NAME" \
              "-PCATTV_VERSION_CODE=$VERSION_CODE" \
              "-PCATTV_APPLICATION_ID=$PACKAGE" \
              "-PRELEASE_STORE_FILE=$RUNNER_TEMP/cattv-release.jks" \
              "-PRELEASE_KEY_ALIAS=$CATTV_KEY_ALIAS" \
              "-PRELEASE_STORE_PASSWORD=$CATTV_STORE_PASSWORD" \
              "-PRELEASE_KEY_PASSWORD=$CATTV_KEY_PASSWORD"
            OUT="CatTV_${VERSION_NAME}${SUFFIX}_arm64-v8a.apk"
            cp app/build/outputs/apk/release/AVBox_release.apk "dist/$OUT"
            CERTS="$("$APKSIGNER" verify --print-certs "dist/$OUT")"
            grep -F "certificate SHA-256 digest: 59749dbdd0679fc48d9546b88e16cd345896b9664e5d42bf34552da23483bd62" <<< "$CERTS"
            BADGING="$("$AAPT" dump badging "dist/$OUT")"
            grep -F "package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
            grep -F "native-code: 'arm64-v8a'" <<< "$BADGING"
            (cd dist && sha256sum "$OUT" > "$OUT.sha256")
          done
      - name: Publish mobile release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.versionName || '1.3.4' }}
        run: |
          set -euo pipefail
          OUT="CatTV_${VERSION_NAME}_arm64-v8a.apk"
          COEXIST="CatTV_${VERSION_NAME}_coexist_arm64-v8a.apk"
          NOTES="$(cat <<EOF
          ## 新增
          - 媒体徽章支持识别 4K、HDR、杜比、HEVC 等规格。可粘贴长链接导入 JSON 徽章包，保存多组并自由切换、删除。
          - 播放设置新增退出自动画中画开关。

          ## 优化
          - 点播先进入全屏，返回后在详情页顶部继续播放，可边看边选集。详情内播放器默认收起控件和弹幕。
          - 全屏左下角显示当前影片片名，支持 TMDB 片名标志。媒体规格徽章显示在左上角。
          - 优化豆瓣评分徽标、首页轮播评分和选集封面显示。
          - 修复部分徽章图片链接无法加载的问题。

          ## 安装
          - 1.3.3 用户可使用普通 ARM64 包覆盖升级。
          - 需要与原版共存时，请下载文件名包含 coexist 的 ARM64 包。
          EOF
          )"
          gh release create "v$VERSION_NAME" "dist/$OUT" "dist/$OUT.sha256" "dist/$COEXIST" "dist/$COEXIST.sha256" \
            --target "$GITHUB_SHA" \
            --title "CatTV v$VERSION_NAME" \
            --notes "$NOTES" \
            --latest

