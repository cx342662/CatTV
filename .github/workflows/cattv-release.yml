name: Publish CatTV Signed Release

on:
  push:
    branches:
      - fix/pip-fongmi-style
    paths:
      - ".github/workflows/cattv-release.yml"
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Release version (for example 1.3.2)'
        required: true
        type: string
      versionCode:
        description: 'Android versionCode (must increase, for example 38)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested CatTV branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare branding
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py
      - name: Validate requested version and private signing secrets
        env:
          VERSION_NAME: ${{ inputs.versionName || '1.3.2' }}
          VERSION_CODE: ${{ inputs.versionCode || '38' }}
          CATTV_KEYSTORE_BASE64: ${{ secrets.CATTV_KEYSTORE_BASE64 }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid versionCode"; exit 1; }
          [ "$VERSION_CODE" = "38" ] || { echo "::error::CatTV 1.3.2 must use versionCode 38"; exit 1; }
          test -n "$CATTV_KEYSTORE_BASE64"
          test -n "$CATTV_KEY_ALIAS"
          test -n "$CATTV_STORE_PASSWORD"
          test -n "$CATTV_KEY_PASSWORD"
          printf '%s' "$CATTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cattv-release.jks"
          chmod 600 "$RUNNER_TEMP/cattv-release.jks"
      - name: Build signed release
        env:
          VERSION_NAME: ${{ inputs.versionName || '1.3.2' }}
          VERSION_CODE: ${{ inputs.versionCode || '38' }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            "-PCATTV_VERSION_NAME=$VERSION_NAME" \
            "-PCATTV_VERSION_CODE=$VERSION_CODE" \
            "-PRELEASE_STORE_FILE=$RUNNER_TEMP/cattv-release.jks" \
            "-PRELEASE_KEY_ALIAS=$CATTV_KEY_ALIAS" \
            "-PRELEASE_STORE_PASSWORD=$CATTV_STORE_PASSWORD" \
            "-PRELEASE_KEY_PASSWORD=$CATTV_KEY_PASSWORD"
      - name: Verify signed APK and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.versionName || '1.3.2' }}
          VERSION_CODE: ${{ inputs.versionCode || '38' }}
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/AVBox_release.apk"
          test -s "$SRC"
          OUT="CatTV_${VERSION_NAME}_arm64-v8a.apk"
          cp "$SRC" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$OUT")"
          echo "$BADGING" | head -n 4
          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" >/dev/null
          echo "$BADGING" | grep -F "package: name='com.github.avbox.osc'" >/dev/null
          unzip -l "$OUT" | grep -q 'lib/arm64-v8a/'
          echo "$(sha256sum "$OUT")" > "$OUT.sha256"
          NOTES="$(cat <<EOF
          # CatTV v$VERSION_NAME

          ## 更新内容
          - 参考 FongMi/TV 的原生 Android 系统画中画交互，优化画中画进入与退出。
          - 修复直播画中画切换时播放器视图重挂载风险，降低有声音无画面的概率。
          - 修复点播画中画期间页面覆盖层与播放器视图管理问题。
          - 点播播放时默认隐藏画中画按钮；点击视频显示控制栏后再显示入口。
          - 全屏播放时，画中画按钮固定在视频区域右下角。
          - 优化 PiP 生命周期处理，减少重复初始化播放器宿主。
          - 保留 CatTV 原有播放内核、接口及其他功能。

          ## 安装信息
          - 版本：$VERSION_NAME
          - versionCode：$VERSION_CODE
          - 架构：ARM64-v8a
          - 包名：com.github.avbox.osc
          - 安装包：正式签名 APK
          - 校验：附带 SHA-256 文件
          EOF
          )"
          gh release create "v$VERSION_NAME" "$OUT" "$OUT.sha256" \
            --title "CatTV v$VERSION_NAME" \
            --notes "$NOTES" \
            --latest
