name: Build CatTV Debug APK

on:
  push:
    branches:
      - cattv-branding
    paths:
      - ".github/workflows/build-debug-apk.yml"
      - "app/**"
      - "quickjs/**"
      - "pyramid/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cattv-branding
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/AVBox_debug.apk"
          test -s "$APK" || {
            echo "::error::Expected APK not found: $APK"
            find app/build/outputs/apk -type f -maxdepth 5 -print || true
            exit 1
          }
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify "$APK"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload CatTV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CatTV-debug-arm64-v8a
          path: app/build/outputs/apk/debug/AVBox_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## CatTV Debug APK"
            echo ""
            echo "- Branch: cattv-branding"
            echo "- Variant: debug (Android debug signing)"
            echo "- ABI: arm64-v8a"
            echo "- Size: ${{ steps.verify.outputs.size }}"
            echo "- SHA-256: ${{ steps.verify.outputs.sha256 }}"
            echo "- No production signing key or release secret is used."
          } >> "$GITHUB_STEP_SUMMARY"
