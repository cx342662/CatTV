name: Build CatTV Debug APK

on:
  push:
    branches:
      - cattv-branding
    paths:
      - ".github/workflows/build-debug-apk.yml"
      - "app/**"
      - "scripts/**"
      - "quickjs/**"
      - "pyramid/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cattv-branding
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # GitHub's ubuntu-latest image already includes Android command-line tools.
      # Avoid android-actions/setup-android@v3 here: it attempts to install the
      # removed legacy "tools" package and fails before Gradle can start.
      - name: Install Android SDK platform and NDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          # API 37 is published as android-37.0, while this project's AGP
          # resolves compileSdk 37 via the legacy android-37 directory name.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare clean CatTV branding assets
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py

      - name: Run unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/AVBox_debug.apk"
          test -s "$APK" || {
            echo "::error::Expected APK not found: $APK"
            find app/build/outputs/apk -type f -maxdepth 5 -print || true
            exit 1
          }
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify "$APK"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload CatTV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CatTV-1.3.2-live-redesign-arm64-v8a
          path: app/build/outputs/apk/debug/AVBox_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## CatTV Debug APK"
            echo ""
            echo "- Branch: cattv-branding"
            echo "- Variant: debug (Android debug signing)"
            echo "- ABI: arm64-v8a"
            echo "- Size: ${{ steps.verify.outputs.size }}"
            echo "- SHA-256: ${{ steps.verify.outputs.sha256 }}"
            echo "- No production signing key or release secret is used."
          } >> "$GITHUB_STEP_SUMMARY"
