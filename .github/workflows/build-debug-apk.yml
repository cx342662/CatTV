name: Build CatTV Optimized Release APK

on:
  push:
    branches:
      - cattv-branding
      - fix/pip-fongmi-style
    paths:
      - ".github/workflows/build-debug-apk.yml"
      - "app/**"
      - "scripts/**"
      - "quickjs/**"
      - "pyramid/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build optimized signed release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Android SDK platform and NDK
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CatTV branding assets
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py

      - name: Restore and validate release signing key
        env:
          CATTV_KEYSTORE_BASE64: ${{ secrets.CATTV_KEYSTORE_BASE64 }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CATTV_KEYSTORE_BASE64" || { echo "::error::Missing CATTV_KEYSTORE_BASE64"; exit 1; }
          test -n "$CATTV_KEY_ALIAS" || { echo "::error::Missing CATTV_KEY_ALIAS"; exit 1; }
          test -n "$CATTV_STORE_PASSWORD" || { echo "::error::Missing CATTV_STORE_PASSWORD"; exit 1; }
          test -n "$CATTV_KEY_PASSWORD" || { echo "::error::Missing CATTV_KEY_PASSWORD"; exit 1; }
          printf '%s' "$CATTV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cattv-release.jks"
          chmod 600 "$RUNNER_TEMP/cattv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/cattv-release.jks" -storepass "$CATTV_STORE_PASSWORD" -alias "$CATTV_KEY_ALIAS" >/dev/null
          echo "Release signing key validated."

      - name: Run unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build optimized signed release
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/cattv-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PCATTV_VERSION_NAME=1.3.2 \
            -PCATTV_VERSION_CODE=38

      - name: Verify APK, signature, ABI and report size
        id: verify
        env:
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AVBox_release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.3.2'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='38'" "$RUNNER_TEMP/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          KEY_CERT_SHA="$(keytool -exportcert -keystore "$RUNNER_TEMP/cattv-release.jks" -alias "$CATTV_KEY_ALIAS" -storepass "$CATTV_STORE_PASSWORD" 2>/dev/null | sha256sum | awk '{print $1}')"
          APK_CERT_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || { echo "::error::ARM64 native libraries are missing"; exit 1; }
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::APK contains an unexpected extra ABI"
            exit 1
          fi
          test -n "$APK_CERT_SHA"
          test "$KEY_CERT_SHA" = "$APK_CERT_SHA" || { echo "::error::APK certificate mismatch"; exit 1; }
          unzip -l "$APK" | awk 'NR>3 && $4!="" {print $1, $4}' | sort -nr | head -n 20 > "$RUNNER_TEMP/largest-apk-files.txt"
          SIZE_BYTES="$(stat -c%s "$APK")"
          SIZE_MB="$(awk -v n="$SIZE_BYTES" 'BEGIN {printf "%.2f", n/1048576}')"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          cp "$APK" "CatTV_1.3.2_arm64-v8a.apk"
          printf '%s  %s\n' "$SHA256" "CatTV_1.3.2_arm64-v8a.apk" > "CatTV_1.3.2_arm64-v8a.apk.sha256"
          {
            echo "## CatTV 1.3.2 optimized signed release"
            echo ""
            echo "- Version: 1.3.2 (versionCode 38)"
            echo "- ABI: arm64-v8a (only)"
            echo "- Build type: release (R8 + resource shrinking enabled)"
            echo "- APK size: $SIZE_MB MiB ($SIZE_BYTES bytes)"
            echo "- SHA-256: $SHA256"
            echo "- Signing certificate matches the configured CatTV release keystore."
            echo ""
            echo "### Largest APK entries"
            cat "$RUNNER_TEMP/largest-apk-files.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CatTV 1.3.2 optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: CatTV-1.3.2-release-arm64-v8a
          path: |
            CatTV_1.3.2_arm64-v8a.apk
            CatTV_1.3.2_arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 30
