name: Correct existing CatTV TV v69 package

on:
  push:
    branches: [tv-v66]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/cattv-tv-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@v4
      - name: Locate existing TV v69 release and use its source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MATCHES="$(gh release list --limit 100 --json tagName,name --jq '.[] | select(((.tagName + " " + .name) | test("(^|[^0-9])v?69([^0-9]|$)"; "i")) and ((.tagName + " " + .name) | test("tv"; "i"))) | .tagName')"
          COUNT="$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l)"
          [ "$COUNT" -eq 1 ] || { echo "::error::Expected exactly one existing v69 release, found $COUNT. Do not overwrite a different release."; exit 1; }
          TAG="$MATCHES"
          echo "TV_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          test -f app/build.gradle.kts
          grep -q 'CATTV_TV_BUILD' app/build.gradle.kts || { echo "::error::v69 source does not support TV build switch"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          file = Path("app/build.gradle.kts")
          data = file.read_text()
          old = '"com.github.avbox.osc.tv"'
          new = '"com.cattv.osc.tv"'
          if old in data:
              data = data.replace(old, new)
              file.write_text(data)
          if new not in data:
              raise SystemExit("v69 source has no expected TV package identifier; refusing to publish")
          PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.CATTV_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_B64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            [ -n "${!var}" ] || { echo "::error::Missing signing secret: $var"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cattv-tv.jks"
          chmod 600 "$RUNNER_TEMP/cattv-tv.jks"
      - name: Prepare branding assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py
      - name: Build signed CatTV TV APK
        env:
          KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
          CATTV_BUILTIN_TMDB_KEY: ${{ secrets.CATTV_BUILTIN_TMDB_KEY }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            "-PCATTV_TV_BUILD=true" \
            "-PCATTV_VERSION_CODE=69" \
            "-PCATTV_VERSION_NAME=1.3.2-TV-69" \
            "-PRELEASE_STORE_FILE=$RUNNER_TEMP/cattv-tv.jks" \
            "-PRELEASE_KEY_ALIAS=$KEY_ALIAS" \
            "-PRELEASE_STORE_PASSWORD=$STORE_PASSWORD" \
            "-PRELEASE_KEY_PASSWORD=$KEY_PASSWORD"
      - name: Verify package name, ABI, signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/AVBox_release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.cattv.osc.tv'"
          echo "$BADGING" | grep -F "versionCode='69'"
          echo "$BADGING" | grep -F "native-code: 'armeabi-v7a'"
          cp "$APK" "CatTV-TV-69-armeabi-v7a.apk"
          sha256sum "CatTV-TV-69-armeabi-v7a.apk" > "CatTV-TV-69-armeabi-v7a.apk.sha256"
      - name: Update existing TV v69 release with verified corrected package
        if: env.TV_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TV_RELEASE_TAG" >/dev/null
          gh release upload "$TV_RELEASE_TAG" \
            CatTV-TV-69-armeabi-v7a.apk \
            CatTV-TV-69-armeabi-v7a.apk.sha256 \
            --clobber
          echo "Corrected TV v69 package uploaded to release: $TV_RELEASE_TAG"
      - name: Upload TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: CatTV-TV-69-signed
          path: |
            CatTV-TV-69-armeabi-v7a.apk
            CatTV-TV-69-armeabi-v7a.apk.sha256
          if-no-files-found: error
          retention-days: 30
