name: iOS build and unsigned package
on:
  push:
    branches: [ios/native-port]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        working-directory: ios
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare app icon from Android artwork
        run: swift ios/scripts/prepare-app-icon.swift
      - name: Generate CI-only media fixture
        run: swift ios/scripts/generate-test-video.swift
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile simulator
        run: xcodebuild -project ios/CatTV.xcodeproj -scheme CatTV -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Test app navigation in simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/CatTV.xcodeproj -scheme CatTV -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build/simulator -resultBundlePath ios/build/Navigation.xcresult -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Export UI screenshots
        if: always()
        shell: bash
        run: |
          if [ -d ios/build/Navigation.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Navigation.xcresult --output-path ios/build/ui-attachments
          fi
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CatTV-iOS-ui-screenshots
          path: ios/build/ui-attachments
          if-no-files-found: ignore
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CatTV-iOS-test-results
          path: ios/build/Navigation.xcresult
          if-no-files-found: ignore
      - name: Compile unsigned device Release
        run: xcodebuild -project ios/CatTV.xcodeproj -scheme CatTV -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/package/Payload
          cp -R ios/build/device/Build/Products/Release-iphoneos/CatTV.app ios/build/package/Payload/
          cd ios/build/package
          /usr/bin/ditto -c -k --keepParent Payload ../CatTV-unsigned.ipa
          shasum -a 256 ../CatTV-unsigned.ipa > ../CatTV-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CatTV-iOS-unsigned
          path: |
            ios/build/CatTV-unsigned.ipa
            ios/build/CatTV-unsigned.ipa.sha256
          if-no-files-found: error
