name: CatTV One-time Signed Release v2

on:
  push:
    branches:
      - cattv-branding
    paths:
      - ".github/workflows/cattv-release-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CatTV branding branch
        uses: actions/checkout@v4
        with:
          ref: cattv-branding

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CatTV branding assets
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_cattv_icons.py

      - name: Validate secrets and restore private keystore
        env:
          CATTV_KEYSTORE_BASE64: ${{ secrets.CATTV_KEYSTORE_BASE64 }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CATTV_KEYSTORE_BASE64"
          test -n "$CATTV_KEY_ALIAS"
          test -n "$CATTV_STORE_PASSWORD"
          test -n "$CATTV_KEY_PASSWORD"
          printf '%s' "$CATTV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cattv-release.jks"
          chmod 600 "$RUNNER_TEMP/cattv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/cattv-release.jks" -storepass "$CATTV_STORE_PASSWORD" -alias "$CATTV_KEY_ALIAS" >/dev/null
          echo "Private signing material validated."

      - name: Build CatTV signed release
        env:
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          CATTV_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/cattv-release.jks
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.CATTV_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_CATTV_VERSION_NAME: "1.3.1"
          ORG_GRADLE_PROJECT_CATTV_VERSION_CODE: "35"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CATTV_KEY_ALIAS: ${{ secrets.CATTV_KEY_ALIAS }}
          CATTV_STORE_PASSWORD: ${{ secrets.CATTV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/AVBox_release.apk"
          test -s "$SRC"
          OUT="CatTV_1.3.1_arm64-v8a.apk"
          cp "$SRC" "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/apk-signature.txt"
          "$AAPT" dump badging "$OUT" | head -n 4
          KEY_CERT_SHA="$(keytool -exportcert -keystore "$RUNNER_TEMP/cattv-release.jks" -alias "$CATTV_KEY_ALIAS" -storepass "$CATTV_STORE_PASSWORD" 2>/dev/null | sha256sum | awk '{print $1}')"
          APK_CERT_SHA="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT_SHA"
          test "$KEY_CERT_SHA" = "$APK_CERT_SHA" || { echo "::error::APK certificate does not match configured keystore"; exit 1; }
          sha256sum "$OUT" > "$OUT.sha256"
          gh release create "v1.3.1" "$OUT" "$OUT.sha256" \
            --title "CatTV v1.3.1" \
            --notes "CatTV Android arm64-v8a signed release. First fixed-signature release; later updates use the same signing key. Existing debug builds must be backed up and reinstalled once." \
            --latest
          echo "Published CatTV v1.3.1 with matching certificate and SHA-256 asset digest."
