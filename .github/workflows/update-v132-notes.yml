name: Update CatTV v1.3.2 Release Notes

on:
  push:
    branches:
      - fix/pip-fongmi-style
    paths:
      - ".github/workflows/update-v132-notes.yml"

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update v1.3.2 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## 本次更新
          - 新增画中画功能，直播和点播均可使用。
          - 点播画中画按钮随播放控制栏显示，全屏时位于右下角。
          - 首页增加常用直播频道入口。
          - 优化直播频道分类和列表布局，全屏时也可浏览、切换频道。
          - 增加节目单区域，查看频道节目信息。
          - 优化遥控器操作和频道切换体验。

          **版本：** 1.3.2  
          **适用架构：** ARM64-v8a
          EOF
          gh release edit v1.3.2 --repo cx342662/CatTV --notes-file release-notes.md
