name: Update CatTV v1.3.2 Release Notes

on:
  push:
    branches:
      - fix/pip-fongmi-style
    paths:
      - ".github/workflows/update-v132-notes.yml"

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update v1.3.2 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## 本次更新
          - 优化直播和点播的画中画播放。
          - 点播播放时，画中画按钮默认隐藏；点击画面显示控制栏后出现。
          - 全屏播放时，画中画按钮放在右下角。
          - 修复画中画切换时可能出现的黑屏问题。

          **版本：** 1.3.2  
          **适用架构：** ARM64-v8a
          EOF
          gh release edit v1.3.2 --repo cx342662/CatTV --notes-file release-notes.md
